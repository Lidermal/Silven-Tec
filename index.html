<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silven Tec | Inovação & Gestão</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logost.png">
    
    <!-- Bibliotecas Externas -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- Cabeçalho com Logo -->
    <header class="brand-header">
        <img src="logost.png" alt="Silven Tec Logo" class="main-logo">
        <h1 class="brand-title">SILVEN TEC</h1>
        <p class="brand-subtitle">INOVAÇÃO & GESTÃO</p>
    </header>

    <!-- Painel Central de Login -->
    <main class="login-container">
        <div class="glass-panel">
            
            <!-- Abas de Navegação -->
            <div class="tabs-wrapper">
                <button id="tab-client" class="tab-btn active" onclick="switchTab('client')">ÁREA DO CLIENTE</button>
                <button id="tab-admin" class="tab-btn" onclick="switchTab('admin')">ADMINISTRAÇÃO</button>
            </div>

            <!-- Formulário: Cliente -->
            <div id="form-client" class="form-section">
                <div class="input-group">
                    <label>TOKEN DE ACESSO</label>
                    <input type="text" id="token-input" placeholder="EX: ST-JOAO-X9P2" style="text-transform: uppercase; letter-spacing: 1px;">
                </div>
                <button id="btn-access-client" class="btn-primary full-width">
                    Acessar Projeto <i data-lucide="arrow-right" size="16"></i>
                </button>
            </div>

            <!-- Formulário: Admin -->
            <div id="form-admin" class="form-section hidden">
                <div class="input-group">
                    <label>SENHA MESTRA</label>
                    <input type="password" id="admin-pass" placeholder="••••••••">
                </div>
                <button id="btn-login-admin" class="btn-primary full-width btn-dark">
                    Entrar no Sistema <i data-lucide="shield" size="16"></i>
                </button>
                <p id="admin-error" class="error-msg hidden"></p>
            </div>

        </div>
    </main>

    <!-- Script Principal -->
    <script src="app.js"></script>
    <script>
        // Inicializa ícones assim que a página carrega
        document.addEventListener('DOMContentLoaded', () => {
            if(window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>
