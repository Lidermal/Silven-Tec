<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silven Tec | Inovação & Gestão</title>
    <link rel="stylesheet" href="style.css">
    <!-- Favicon usando a nova logo -->
    <link rel="icon" type="image/png" href="logost.png">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header class="animate-in">
        <!-- Logo Principal -->
        <img src="logost.png" alt="Silven Tec Logo" class="brand-logo">
        <div>
            <h1 class="brand-title">SILVEN TEC</h1>
            <p class="brand-subtitle">INOVAÇÃO & GESTÃO</p>
        </div>
    </header>

    <main class="container animate-in" style="animation-delay: 0.1s;">
        <div class="glass-panel" style="max-width: 480px; margin: 0 auto;">
            
            <!-- Navegação Interna -->
            <div class="tabs-nav" style="justify-content: center; margin-bottom: 1.5rem;">
                <div class="tab-btn active" onclick="switchTab('client')" id="tab-client">ÁREA DO CLIENTE</div>
                <div class="tab-btn" onclick="switchTab('admin')" id="tab-admin">ADMINISTRAÇÃO</div>
            </div>

            <!-- Form Cliente -->
            <div id="form-client">
                <div class="input-group">
                    <label class="input-label">Token de Acesso</label>
                    <input type="text" id="token-input" class="input-field" placeholder="Ex: ST-JOAO-X9P2" style="text-transform: uppercase; letter-spacing: 1px;">
                </div>
                <button onclick="handleClientAccess()" class="btn-primary">
                    <i data-lucide="log-in" size="18"></i> Acessar Projeto
                </button>
            </div>

            <!-- Form Admin -->
            <div id="form-admin" class="hidden">
                <div class="input-group">
                    <label class="input-label">Senha Mestra</label>
                    <input type="password" id="admin-pass" class="input-field" placeholder="••••••••">
                </div>
                <button onclick="handleAdminLogin()" class="btn-primary" style="background: linear-gradient(90deg, #334155, #475569);">
                    <i data-lucide="shield" size="18"></i> Entrar no Sistema
                </button>
                <p id="admin-error" class="text-red" style="font-size: 0.8rem; margin-top: 1rem; text-align: center;" class="hidden"></p>
            </div>

        </div>
    </main>

    <script src="app.js"></script>
    <script>
        lucide.createIcons();
        function switchTab(type) {
            document.getElementById('tab-client').classList.toggle('active', type === 'client');
            document.getElementById('tab-admin').classList.toggle('active', type === 'admin');
            document.getElementById('form-client').classList.toggle('hidden', type !== 'client');
            document.getElementById('form-admin').classList.toggle('hidden', type !== 'admin');
        }
    </script>
</body>
</html>
