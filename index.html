<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silven Tec | Inovação & Gestão</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logost.png">
    <!-- Bibliotecas Externas -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="app.js" defer></script>
</head>
<body>

    <header>
        <img src="logost.png" alt="Silven Tec Logo" class="brand-logo">
        <div>
            <h1 class="brand-title">SILVEN TEC</h1>
            <p class="brand-subtitle">INOVAÇÃO & GESTÃO</p>
        </div>
    </header>

    <main class="main-container">
        <div class="glass-panel">
            
            <!-- Abas Internas -->
            <div class="tabs-nav">
                <button type="button" class="tab-btn active" id="btn-tab-client">ÁREA DO CLIENTE</button>
                <button type="button" class="tab-btn" id="btn-tab-admin">ADMINISTRAÇÃO</button>
            </div>

            <!-- Formulário Cliente -->
            <div id="form-client">
                <div class="input-group">
                    <label class="input-label">Token de Acesso</label>
                    <input type="text" id="token-input" class="input-field" placeholder="Ex: ST-JOAO-X9P2" style="text-transform: uppercase; letter-spacing: 2px; font-family: 'Orbitron', monospace;">
                </div>
                <button type="button" id="btn-access-client" class="btn-primary">
                    <i data-lucide="log-in" size="18"></i> Acessar Projeto
                </button>
            </div>

            <!-- Formulário Admin -->
            <div id="form-admin" class="hidden">
                <div class="input-group">
                    <label class="input-label">Senha Mestra</label>
                    <input type="password" id="admin-pass" class="input-field" placeholder="••••••••">
                </div>
                <button type="button" id="btn-login-admin" class="btn-primary" style="background: linear-gradient(90deg, #334155, #475569);">
                    <i data-lucide="shield-check" size="18"></i> Entrar no Sistema
                </button>
                <p id="admin-error" class="text-error hidden"></p>
            </div>

        </div>
    </main>

</body>
</html>
