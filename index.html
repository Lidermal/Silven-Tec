<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silven Tec | Acesso ao Sistema</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="login-container" id="auth-box">
        <div class="logo-area">
            <h1>Silven<span>Tec</span></h1>
            <p>Gestão inteligente de projetos e pagamentos</p>
        </div>

        <form id="login-form">
            <div class="input-group">
                <label>E-mail corporativo</label>
                <input type="email" id="email" placeholder="nome@empresa.com" required>
            </div>
            
            <div class="input-group">
                <label>Senha de acesso</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary">Entrar no Painel</button>
        </form>

        <div class="footer-links">
            Não tem conta? <a href="#" onclick="toggleMode()">Solicitar acesso</a>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
