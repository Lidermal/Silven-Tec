<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silven Tec | Sistema de Gestão</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="auth-screen" class="screen active">
        <div class="login-container">
            <div class="logo-area">
                <h1>Silven<span>Tec</span></h1>
                <p>Gestão inteligente de projetos e pagamentos</p>
            </div>
            <form id="auth-form">
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" id="auth-btn">Entrar no Painel</button>
            </form>
            <div class="footer-links">
                <a href="#" onclick="toggleAuthMode()" id="auth-toggle">Não tem conta? Solicitar acesso</a>
            </div>
        </div>
    </div>

    <!-- SISTEMA PRINCIPAL -->
    <div id="app-screen" class="screen hidden">
        <aside class="sidebar">
            <div class="logo">Silven<span>Tec</span></div>
            <nav id="sidebar-nav"></nav>
            <button onclick="logout()" class="btn-logout">Sair do Sistema</button>
        </aside>
        <main class="content">
            <header>
                <h2 id="page-title">Dashboard</h2>
                <div class="user-badge" id="user-name">Usuário</div>
            </header>
            <div id="main-content"></div>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
