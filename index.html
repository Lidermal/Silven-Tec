<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silven Tec | Inovação & Gestão</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logost.png">
    <!-- Supabase e Lucide -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Script com DEFER para garantir carregamento após DOM -->
    <script src="app.js" defer></script>
</head>
<body>

    <header class="animate-in">
        <img src="logost.png" alt="Silven Tec Logo" class="brand-logo">
        <div>
            <h1 class="brand-title">SILVEN TEC</h1>
            <p class="brand-subtitle">INOVAÇÃO & GESTÃO</p>
        </div>
    </header>

    <main class="container animate-in" style="animation-delay: 0.1s;">
        <div class="glass-panel" style="max-width: 460px; margin: 0 auto;">
            
            <div class="tabs-nav" style="justify-content: center; margin-bottom: 2rem;">
                <div class="tab-btn active" onclick="switchTab('client')" id="tab-client">ÁREA DO CLIENTE</div>
                <div class="tab-btn" onclick="switchTab('admin')" id="tab-admin">ADMINISTRAÇÃO</div>
            </div>

            <!-- Form Cliente -->
            <div id="form-client">
                <div class="input-group">
                    <label class="input-label">Token de Acesso</label>
                    <input type="text" id="token-input" class="input-field" placeholder="Ex: ST-JOAO-X9P2" style="text-transform: uppercase; letter-spacing: 2px; font-family: 'Orbitron', monospace;">
                </div>
                <button onclick="handleClientAccess()" class="btn-primary">
                    <i data-lucide="log-in" size="18"></i> Acessar Projeto
                </button>
            </div>

            <!-- Form Admin -->
            <div id="form-admin" class="hidden">
                <div class="input-group">
                    <label class="input-label">Senha Mestra</label>
                    <input type="password" id="admin-pass" class="input-field" placeholder="••••••••">
                </div>
                <button onclick="handleAdminLogin()" class="btn-primary" style="background: linear-gradient(90deg, #1e293b, #334155);">
                    <i data-lucide="shield-check" size="18"></i> Entrar no Sistema
                </button>
                <p id="admin-error" class="hidden" style="color: #ef4444; font-size: 0.85rem; margin-top: 1rem; text-align: center; font-weight: 500;"></p>
            </div>

        </div>
    </main>

    <script>
        // Inicializa ícones assim que disponível
        document.addEventListener('DOMContentLoaded', () => {
            if(window.lucide) lucide.createIcons();
        });

        function switchTab(type) {
            const tabC = document.getElementById('tab-client');
            const tabA = document.getElementById('tab-admin');
            const formC = document.getElementById('form-client');
            const formA = document.getElementById('form-admin');
            const errEl = document.getElementById('admin-error');

            if (type === 'client') {
                tabC.classList.add('active'); tabA.classList.remove('active');
                formC.classList.remove('hidden'); formA.classList.add('hidden');
            } else {
                tabA.classList.add('active'); tabC.classList.remove('active');
                formA.classList.remove('hidden'); formC.classList.add('hidden');
            }
            if(errEl) errEl.classList.add('hidden');
        }
    </script>
</body>
</html>
