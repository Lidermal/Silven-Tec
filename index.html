<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silven Tec | Gestão de Projetos</title>
    <!-- Tailwind CSS via CDN (Funciona em qualquer lugar) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Fonte Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0B0F19; color: #E2E8F0; }
        .font-tech { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .neon-text { text-shadow: 0 0 10px rgba(99, 102, 241, 0.5); }
        .hidden-section { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar Simples -->
    <nav class="p-4 border-b border-slate-800 flex justify-between items-center glass sticky top-0 z-50">
        <div class="text-xl font-tech text-indigo-400 tracking-wider cursor-pointer" onclick="showSection('home')">SILVEN TEC</div>
        <div class="space-x-4 text-sm">
            <button onclick="showSection('admin-login')" class="hover:text-indigo-400 transition">Admin</button>
            <button onclick="checkClientToken()" class="bg-indigo-600 px-4 py-1 rounded hover:bg-indigo-700 transition">Área Cliente</button>
        </div>
    </nav>

    <!-- SEÇÃO: HOME -->
    <section id="home" class="flex-grow flex items-center justify-center p-6">
        <div class="text-center space-y-6 max-w-2xl">
            <h1 class="text-5xl md:text-7xl font-tech text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400 neon-text">
                SILVEN TEC
            </h1>
            <p class="text-slate-400 text-lg">Gestão de projetos tecnológicos, contratos inteligentes e pagamentos automatizados.</p>
            <div class="flex gap-4 justify-center pt-4">
                <button onclick="showSection('admin-login')" class="px-8 py-3 bg-indigo-600 rounded-lg font-bold hover:bg-indigo-700 shadow-[0_0_15px_rgba(99,102,241,0.4)] transition">
                    Acessar Painel
                </button>
            </div>
        </div>
    </section>

    <!-- SEÇÃO: LOGIN ADMIN -->
    <section id="admin-login" class="hidden-section flex-grow flex items-center justify-center p-6">
        <div class="glass p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <h2 class="text-2xl font-tech text-center mb-6 text-indigo-300">ACESSO RESTRITO</h2>
            <input type="password" id="adminPass" placeholder="Senha Mestra" class="w-full p-3 bg-slate-800 rounded border border-slate-700 mb-4 focus:border-indigo-500 outline-none text-white">
            <button onclick="loginAdmin()" class="w-full bg-indigo-600 py-3 rounded font-bold hover:bg-indigo-700 transition">ENTRAR</button>
            <p id="loginError" class="text-red-400 text-sm mt-3 text-center hidden">Senha incorreta!</p>
        </div>
    </section>

    <!-- SEÇÃO: PAINEL ADMIN -->
    <section id="admin-panel" class="hidden-section flex-grow p-6 max-w-6xl mx-auto w-full">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-tech text-cyan-400">Painel Administrativo</h2>
            <button onclick="logout()" class="text-red-400 hover:text-red-300 text-sm">Sair</button>
        </div>

        <!-- Form Novo Projeto -->
        <div class="glass p-6 rounded-xl mb-8">
            <h3 class="text-xl font-bold mb-4 text-indigo-300">Novo Projeto</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input id="newClient" placeholder="Nome do Cliente" class="p-3 bg-slate-800 rounded border border-slate-700 text-white">
                <input id="newTitle" placeholder="Título do Projeto" class="p-3 bg-slate-800 rounded border border-slate-700 text-white">
                <input id="newValue" type="number" placeholder="Valor (R$)" class="p-3 bg-slate-800 rounded border border-slate-700 text-white">
            </div>
            <button onclick="createProject()" class="mt-4 bg-emerald-600 px-6 py-2 rounded font-medium hover:bg-emerald-700 transition">Cadastrar</button>
        </div>

        <!-- Lista Projetos -->
        <div id="projectsList" class="space-y-4">
            <!-- Projetos serão inseridos aqui via JS -->
            <p class="text-slate-500 text-center">Carregando projetos...</p>
        </div>
    </section>

    <!-- SEÇÃO: ÁREA CLIENTE -->
    <section id="client-area" class="hidden-section flex-grow p-6">
        <div class="max-w-2xl mx-auto glass p-8 rounded-2xl border border-indigo-500/20 shadow-2xl">
            <h1 id="clientTitle" class="text-3xl font-tech text-indigo-400 mb-2">Carregando...</h1>
            <p id="clientName" class="text-slate-400 mb-6">Aguarde...</p>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-slate-800/50 p-4 rounded-lg">
                    <span class="text-xs text-slate-500 uppercase">Status</span>
                    <p id="clientStatus" class="text-xl font-bold text-emerald-400">-</p>
                </div>
                <div class="bg-slate-800/50 p-4 rounded-lg">
                    <span class="text-xs text-slate-500 uppercase">Prazo</span>
                    <p id="clientDeadline" class="text-xl font-bold text-white">-</p>
                </div>
            </div>

            <div class="border-t border-slate-800 pt-6">
                <h3 class="text-lg font-bold mb-4">Pagamento</h3>
                <button id="btnPay" onclick="generatePayment()" class="w-full bg-indigo-600 py-3 rounded-lg font-bold hover:bg-indigo-700 transition">
                    Gerar Link de Pagamento (PIX/Cartão)
                </button>
                <a id="payLink" href="#" target="_blank" class="hidden w-full bg-emerald-600 text-center py-3 rounded-lg font-bold hover:bg-emerald-700 transition block mt-2">
                    Finalizar Pagamento Agora
                </a>
            </div>
        </div>
    </section>

    <!-- LÓGICA JAVASCRIPT -->
    <script src="app.js"></script>
</body>
</html>
