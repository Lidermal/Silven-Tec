<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Silven Tec</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logost.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header style="padding: 1.5rem 2rem; flex-direction: row; justify-content: space-between; text-align: left; border-bottom: 1px solid var(--border-color); background: rgba(11,15,25,0.8); backdrop-filter: blur(10px);">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <img src="logost.png" alt="Logo" style="width: 45px; height: 45px;" onerror="this.style.display='none'">
            <div>
                <h1 style="font-family: 'Orbitron'; font-size: 1.3rem; color: white; letter-spacing: 1px;">SILVEN TEC</h1>
                <span style="font-size: 0.7rem; color: var(--cyan-primary); letter-spacing: 3px; font-weight: 600;">PAINEL ADMIN</span>
            </div>
        </div>
        <button onclick="window.logout()" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: all 0.3s;" onmouseover="this.style.borderColor='#ef4444'; this.style.color='#ef4444'" onmouseout="this.style.borderColor='var(--border-color)'; this.style.color='var(--text-muted)'">Sair do Sistema</button>
    </header>

    <main class="container" style="margin-top: 3rem;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem;">
            <div class="glass-panel" style="border-left: 4px solid var(--cyan-primary); padding: 1.5rem;">
                <p class="input-label" style="margin-bottom: 0.5rem;">Projetos Ativos</p>
                <h2 id="stat-projects" style="font-size: 2.2rem; color: white; font-weight: 700;">-</h2>
            </div>
            <div class="glass-panel" style="border-left: 4px solid #10b981; padding: 1.5rem;">
                <p class="input-label" style="margin-bottom: 0.5rem;">Receita Mensal Prevista</p>
                <h2 id="stat-revenue" style="font-size: 2.2rem; color: #10b981; font-weight: 700;">R$ 0,00</h2>
            </div>
        </div>

        <div class="glass-panel" style="margin-bottom: 2.5rem;">
            <h3 style="color: var(--cyan-primary); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.6rem; font-size: 1.1rem;">
                <i data-lucide="plus-circle" size="20"></i> Cadastrar Novo Projeto
            </h3>
            <form id="form-new-project" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.2rem;">
                <input id="new-client" class="input-field" placeholder="Nome do Cliente" required>
                <input id="new-title" class="input-field" placeholder="Título do Projeto" required>
                <input id="new-value" type="number" step="0.01" class="input-field" placeholder="Valor Mensal (R$)" required>
                <button type="submit" class="btn-primary">Criar Projeto</button>
            </form>
        </div>

        <div class="glass-panel">
            <h3 style="color: white; margin-bottom: 1.5rem; font-size: 1.1rem;">Projetos Recentes</h3>
            <div id="projects-list" style="display: flex; flex-direction: column; gap: 1rem;"></div>
        </div>
    </main>

    <script src="app.js?v=4"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
