<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Silven Tec</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logost.png">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header style="padding: 1.5rem; flex-direction: row; justify-content: space-between; text-align: left; border-bottom: 1px solid var(--border-color);">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <img src="logost.png" alt="Logo" style="width: 40px; height: 40px;">
            <div>
                <h1 style="font-family: 'Orbitron'; font-size: 1.2rem; color: white;">SILVEN TEC</h1>
                <span style="font-size: 0.7rem; color: var(--cyan-primary); letter-spacing: 2px;">PAINEL ADMIN</span>
            </div>
        </div>
        <button onclick="logout()" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer;">Sair</button>
    </header>

    <main class="container" style="margin-top: 2rem;">
        <!-- Stats -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
            <div class="glass-panel" style="border-left: 4px solid var(--cyan-primary);">
                <p class="input-label">Projetos Ativos</p>
                <h2 id="stat-projects" style="font-size: 2rem; color: white;">-</h2>
            </div>
            <div class="glass-panel" style="border-left: 4px solid #10b981;">
                <p class="input-label">Receita Mensal</p>
                <h2 id="stat-revenue" style="font-size: 2rem; color: #10b981;">R$ 0,00</h2>
            </div>
        </div>

        <!-- Novo Projeto -->
        <div class="glass-panel" style="margin-bottom: 2rem;">
            <h3 style="color: var(--cyan-primary); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;"><i data-lucide="plus-circle"></i> Novo Projeto</h3>
            <form id="form-new-project" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                <input id="new-client" class="input-field" placeholder="Nome do Cliente" required>
                <input id="new-title" class="input-field" placeholder="Título do Projeto" required>
                <input id="new-value" type="number" step="0.01" class="input-field" placeholder="Valor (R$)" required>
                <button type="submit" class="btn-primary">Cadastrar</button>
            </form>
        </div>

        <!-- Lista -->
        <div class="glass-panel">
            <h3 style="color: white; margin-bottom: 1.5rem;">Projetos Recentes</h3>
            <div id="projects-list" style="display: flex; flex-direction: column; gap: 1rem;"></div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        if(!sessionStorage.getItem('silven_admin')) window.location.href = 'index.html';
        else initAdmin();
        lucide.createIcons();
    </script>
</body>
</html>
