<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Silven Tec</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="p-4 md:p-8">

    <!-- Navbar -->
    <nav class="glass-panel rounded-xl px-6 py-4 flex justify-between items-center mb-8 max-w-7xl mx-auto">
        <div class="flex items-center gap-3">
            <span class="text-xl font-tech text-cyan-400">SILVEN TEC <span class="text-xs text-slate-500 ml-2 font-inter">| ADMIN</span></span>
        </div>
        <button onclick="logout()" class="text-red-400 hover:text-red-300 text-sm font-bold flex items-center gap-2">
            <i data-lucide="log-out" size="16"></i> SAIR
        </button>
    </nav>

    <main class="max-w-7xl mx-auto space-y-8 animate-fade-in">
        
        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass-panel p-6 rounded-xl border-l-4 border-cyan-500">
                <p class="text-slate-400 text-xs uppercase font-bold">Projetos Ativos</p>
                <h3 id="stat-projects" class="text-3xl font-bold text-white mt-2">-</h3>
            </div>
            <div class="glass-panel p-6 rounded-xl border-l-4 border-emerald-500">
                <p class="text-slate-400 text-xs uppercase font-bold">Receita Mensal</p>
                <h3 id="stat-revenue" class="text-3xl font-bold text-emerald-400 mt-2">R$ 0,00</h3>
            </div>
            <div class="glass-panel p-6 rounded-xl border-l-4 border-purple-500">
                <p class="text-slate-400 text-xs uppercase font-bold">Contratos Assinados</p>
                <h3 id="stat-signed" class="text-3xl font-bold text-purple-400 mt-2">-</h3>
            </div>
        </div>

        <!-- Novo Projeto -->
        <div class="glass-panel p-6 rounded-xl">
            <h3 class="text-lg font-bold text-cyan-300 mb-4 flex items-center gap-2"><i data-lucide="plus-circle" size="18"></i> Cadastrar Novo Projeto</h3>
            <form id="form-new-project" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input id="new-client" placeholder="Nome do Cliente" required class="input-field">
                <input id="new-title" placeholder="Título do Projeto" required class="input-field">
                <input id="new-value" type="number" step="0.01" placeholder="Valor Mensal (R$)" required class="input-field">
                <button type="submit" class="btn-primary">Criar Projeto</button>
            </form>
        </div>

        <!-- Lista -->
        <div class="glass-panel p-6 rounded-xl">
            <h3 class="text-lg font-bold text-slate-300 mb-4">Projetos Recentes</h3>
            <div id="projects-list" class="space-y-3">
                <p class="text-slate-500 text-sm">Carregando dados...</p>
            </div>
        </div>

    </main>

    <script src="app.js"></script>
    <script>
        // Proteção simples de rota
        if(!sessionStorage.getItem('silven_admin')) window.location.href = 'index.html';
        else initAdmin();
    </script>
</body>
</html>
